<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Release the Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-label {
            font-weight: 600;
        }
        .form-control[readonly] {
            background-color: #f8f9fa;
            font-weight: 500;
        }
        .btn-space {
            margin-right: 10px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm rounded-4">
            <div class="card-header bg-warning text-dark text-center fs-4 rounded-top-4">
                Release the Parking Spot
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Spot ID</label>
                        <input type="text" class="form-control" value="{{ booking.spot_id }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Vehicle Number</label>
                        <input type="text" class="form-control" value="{{ booking.vehicle_number }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Parking Time</label>
                        <input type="text" class="form-control" value="{{ booking.booking_time.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Releasing Time</label>
                        <input type="text" class="form-control" value="{{ now.strftime('%Y-%m-%d %H:%M:%S') }}" readonly>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Total Cost</label>
                        <input type="text" class="form-control" value="{{ '%.2f' % booking.total_cost if booking.total_cost else 'Calculated after release' }}" readonly>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-space">Release</button>
                        <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

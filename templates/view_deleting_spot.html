<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow rounded-4">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">View / Delete Parking Spot</h4>
        </div>

        <div class="card-body">
            <div class="mb-3">
                <label class="form-label"><strong>Spot ID:</strong></label>
                <p class="form-control-plaintext">{{ spot.id }}</p>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Status:</strong></label>
                <p class="form-control-plaintext">{{ spot.status }}</p>
            </div>

            <form action="{{ url_for('view_deleting_spot', spot_id=spot.id) }}" method="POST" class="d-flex gap-3">
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Close</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Edit Parking Lot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Edit Parking Lot</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Lot Name</label>
            <input type="text" class="form-control" name="lot_name" value="{{ lot.lot_name }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" name="address" value="{{ lot.address }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Pincode</label>
            <input type="text" class="form-control" name="pin_code" value="{{ lot.pin_code }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Price (per hour)</label>
            <input type="number" class="form-control" name="price" value="{{ lot.price }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Spots</label>
            <input type="number" class="form-control" name="total_spots" value="{{ lot.total_spots }}" required>
        </div>
        <button type="submit" class="btn btn-primary">Update Lot</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>

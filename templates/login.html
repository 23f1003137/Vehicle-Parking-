<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
   <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
        <a class="navbar-brand" >
            <span style="font-weight: 800; font-size: 1.7rem; color: #ffc107;">Safe</span><span
                style="font-weight: 800; font-size: 1.7rem; color: #ffffff;">Lot</span>
        </a>
    </nav>

<div class="container d-flex justify-content-center align-items-center vh-100 color-bl">
  <div class="card p-4 shadow" style="min-width: 400px;">
    <h3 class="text-center mb-4">Login</h3>
    <form method="POST">

      <div class="mb-3">
        <label for="email_id" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email_id" name="email_id" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Login</button>
      </div>

      <div class="text-center mt-3">
        Don’t have an account? <a href="{{ url_for('register') }}">Register</a>
      </div>
    </form>
  </div>
</div>

</body>
</html>

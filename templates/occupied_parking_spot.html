<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Occupied Parking Spot Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow rounded-4">
        <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
            <h4 class="mb-0">Occupied Parking Spot Details</h4>
        </div>

        <div class="card-body">
            <div class="mb-3">
                <label class="form-label"><strong>Spot ID:</strong></label>
                <p class="form-control-plaintext">{{ spot.id }}</p>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Status:</strong></label>
                <p class="form-control-plaintext">{{ spot.status }}</p>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Customer ID:</strong></label>
                <p class="form-control-plaintext">{{ booking.user_id }}</p>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Vehicle Number:</strong></label>
                <p class="form-control-plaintext">{{ booking.vehicle_number }}</p>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Start Time of Parking:</strong></label>
                <p class="form-control-plaintext">
                    {% if booking.booking_time %}{{ booking.booking_time.strftime('%Y-%m-%d %H:%M') }}{% else %}N/A{% endif %}
                </p>

            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Parking Cost:</strong></label>
                <p class="form-control-plaintext">{{ spot.lot.price }}</p>
            </div>

        
            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Close</a>
        </div>
    </div>
</div>

</body>
</html>

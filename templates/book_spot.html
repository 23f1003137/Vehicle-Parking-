<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Parking Spot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-box {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #fff3cd;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .btn-group {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="form-box">
    <h4 class="text-center mb-4"> Book the Parking Spot</h4>

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Spot ID:</label>
            <input type="text" class="form-control" value="{{ spot.id }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Lot ID:</label>
            <input type="text" class="form-control" value="{{ lot.id }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">User ID:</label>
            <input type="text" class="form-control" value="{{ user_id }}" readonly>
        </div>

        <div class="mb-3">
            <label class="form-label">Vehicle Number:</label>
            <input type="text" name="vehicle_number" class="form-control" placeholder="Enter vehicle number" required>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-primary">Reserve</button>
            <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

</body>
</html>

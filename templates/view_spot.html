<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Available Spots</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <h2>Available Spots in {{ lot.lot_name }}</h2>

    <div class="row">
        {% for spot in spots %}
        <div class="col-md-3 mb-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Spot ID: {{ spot.id }}</h5>
                    <p>Status: 
                        {% if spot.status == 'A' %}
                            <span class="text-success fw-bold">Available</span>
                        {% else %}
                            <span class="text-danger">Occupied</span>
                        {% endif %}
                    </p>
                    {% if spot.status == 'A' %}
                        <a href="{{ url_for('book_spot', lot_id=lot.id, spot_id=spot.id) }}" class="btn btn-primary">Book Spot</a>
                    {% else %}
                        <button class="btn btn-secondary" disabled>Unavailable</button>
                    {% endif %}
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</body>
</html>
